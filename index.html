<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F0EE">
<title>Reparto</title>
<link rel="manifest" href="./manifest.json">
<style>
/* Sistema base de la sección 0 de ARQUITECTURA. No hay más colores que estos. */
:root {
  --lienzo: #F3F0EE;
  --tinta: #141413;
  --superficie: #FCFBFA;
  --linea: rgba(20, 20, 19, .10);
  --tinta-60: #696969;
  --tinta-40: #D1CDC7;
  --senal: #CF4500;           /* Signal Orange: único color agresivo, uso escaso */
  --aviso: #9A3A0A;           /* Clay Brown */
  --enlace: #3860BE;          /* Link Blue, solo para enlaces */
  --r-s: 20px;
  --r-l: 40px;
  --r-full: 999px;
  --fila: 44px;
  --lado: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--lienzo);
  color: var(--tinta);
  font: 450 16px/1.4 "Sofia Sans", system-ui, -apple-system, sans-serif;
  padding: var(--lado) var(--lado) 88px;
  max-width: 560px;
  margin: 0 auto;
  /* Cero sombras en toda la app: la jerarquía se hace con superficie sobre lienzo y hairlines. */
}

/* Cifras: tabular es obligatorio en toda columna de importe. */
.tabular { font-variant-numeric: tabular-nums; }

.titular { font-weight: 500; letter-spacing: -0.02em; }
h1.titular { font-size: 28px; margin-bottom: 4px; }

.eyebrow {
  font: 700 14px/1 system-ui, sans-serif;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--tinta-60);
  margin: 20px 0 4px;
}
.eyebrow::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--senal);
  margin-right: 8px;
  vertical-align: middle;
}

.seccion {
  background: var(--superficie);
  border-radius: var(--r-l);
  padding: 4px var(--lado) 8px;
  margin-bottom: 12px;
}

.fila {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: var(--fila);
  border-bottom: 1px solid var(--linea);
  gap: 12px;
}
.fila:last-child { border-bottom: 0; }
.subfila { padding-left: var(--lado); min-height: 36px; }
.grupo:last-child .fila:last-child { border-bottom: 0; }

.celda-nombre { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.celda-nombre > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.celda-cifras { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }

.apagado { color: var(--tinta-60); font-size: 14px; }
.senal { color: var(--senal); }
.aviso { color: var(--aviso); }

.badge {
  font-size: 12px;
  border: 1px solid currentColor;
  border-radius: var(--r-full);
  padding: 0 8px;
  align-self: flex-start;
}

.tarjeta-grande { padding: 12px 0 4px; }
.tarjeta-grande .titular { font-size: 40px; display: inline-block; }

.vacio { color: var(--tinta-40); padding: 16px 0; }

/* Gráfica */
.grafica { margin: 8px 0 4px; }
.grafica-svg { display: block; width: 100%; height: 200px; }
.ejes, .leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-60); margin-top: 6px; }
.serie-lista { margin-top: 8px; }

/* Botones y pestañas */
.boton {
  font: inherit;
  border: 1px solid var(--linea);
  background: var(--superficie);
  color: var(--tinta);
  border-radius: var(--r-full);
  padding: 10px 18px;
  min-height: var(--fila);
  cursor: pointer;
}
.boton-menor { min-height: 32px; padding: 4px 12px; font-size: 14px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }

.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 8px var(--lado) calc(8px + env(safe-area-inset-bottom));
  background: var(--lienzo);
  border-top: 1px solid var(--linea);
}
.tab {
  font: inherit;
  border: 1px solid var(--linea);
  background: var(--superficie);
  border-radius: var(--r-full);
  padding: 10px 20px;
  min-height: var(--fila);
  color: var(--tinta);
  cursor: pointer;
}
.tab-activa { background: var(--tinta); color: var(--lienzo); border-color: var(--tinta); }

/* Barra de mensajes: los códigos de error llegan aquí, en castellano. */
#mensaje {
  position: fixed;
  left: var(--lado); right: var(--lado); bottom: 76px;
  background: var(--tinta);
  color: var(--lienzo);
  border-radius: var(--r-s);
  padding: 12px var(--lado);
  display: none;
}
#mensaje.senal { background: var(--senal); }
#mensaje.visible { display: block; }

@media (prefers-reduced-motion: no-preference) {
  .boton, .tab { transition: background .12s ease; }
}

/* Hoja inferior: sustituye a prompt(). --r-l arriba, como pide la sección 0. */
.hoja-envoltorio { position: fixed; inset: 0; z-index: 10; }
.velo { position: absolute; inset: 0; background: rgba(20, 20, 19, .35); }
.hoja {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: var(--superficie);
  border-radius: var(--r-l) var(--r-l) 0 0;
  padding: 8px var(--lado) calc(var(--lado) + env(safe-area-inset-bottom));
  max-width: 560px;
  margin: 0 auto;
}
.hoja-campo { display: flex; align-items: baseline; gap: 8px; padding: 8px 0 4px; }
.campo {
  font: 500 32px/1.2 inherit;
  letter-spacing: -0.02em;
  border: 0;
  border-bottom: 1px solid var(--linea);
  background: transparent;
  color: var(--tinta);
  width: 100%;
  padding: 4px 0;
}
.campo:focus { outline: none; border-bottom-color: var(--tinta); }
.boton-principal { background: var(--tinta); color: var(--lienzo); border-color: var(--tinta); }

/* Utilidades: exportar, importar, deshacer. En las tres pestañas. */
.utilidades { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 20px 0 8px; }
</style>
</head>

// ============================================================
  // nucleo — utilidades sin dominio
  // Aritmética entera de céntimos, decimales de activo con BigInt
  // escalado, fechas y meses en Europe/Madrid, id y hash.
  // No depende de ningún otro módulo. Sin dependencias externas.
  // ============================================================
  (function (global) {
    'use strict';

    var nucleo = {};

    // ------------------------------------------------------------
    // Parser decimal común (con signo, sin floats)
    // Solo acepta '.' como separador decimal; la coma se normaliza
    // en la capa de entrada de la UI, no aquí.
    // Redondeo half-away-from-zero cuando hay más dígitos decimales
    // de los permitidos.
    // ------------------------------------------------------------
    var RE_DECIMAL = /^([+-]?)(\d+)(?:\.(\d+))?$/;

    function parseDecimalABigInt(texto, decimales) {
      if (typeof texto !== 'string') return null;
      var t = texto.trim();
      if (t === '') return null;
      var m = RE_DECIMAL.exec(t);
      if (!m) return null;

      var negativo = m[1] === '-';
      var entero = BigInt(m[2]);
      var fracOriginal = m[3] || '';
      var factor = 10n ** BigInt(decimales);
      var base;

      if (fracOriginal.length <= decimales) {
        var fracPadded = fracOriginal.padEnd(decimales, '0');
        var fracBig = fracPadded === '' ? 0n : BigInt(fracPadded);
        base = entero * factor + fracBig;
      } else {
        var mantenida = fracOriginal.slice(0, decimales);
        var siguienteDigito = fracOriginal.charCodeAt(decimales) - 48;
        var mantenidaBig = mantenida === '' ? 0n : BigInt(mantenida.padEnd(decimales, '0'));
        base = entero * factor + mantenidaBig;
        if (siguienteDigito >= 5) base += 1n;
      }

      return negativo ? -base : base;
    }

    function numDecimales(escalaFactor) {
      // Asume escalaFactor = 10^n exacto (1e8, 1e6, ...)
      return escalaFactor.toString().length - 1;
    }

    // ------------------------------------------------------------
    // Resolución de escala para las funciones de unidades.
    // Todas las funciones de unidades aceptan la escala en dos
    // formas equivalentes:
    //   - un entero de decimales, p. ej. 8, 6            (RECOMENDADO:
    //     es la misma unidad que usa `activo.decimales` y
    //     `nucleo.normalizarUnidades`, así que evita conversiones
    //     manuales en el resto de módulos)
    //   - un factor BigInt ya escalado, p. ej. 100000000n, 1000000n
    //     (compatibilidad con nucleo.ESCALA_CRIPTO / ESCALA_PARTICIPACIONES)
    // Devuelve el factor BigInt correspondiente, o null si la
    // escala no es válida en ninguna de las dos formas.
    // ------------------------------------------------------------

      }
      if (typeof escala === 'number' && Number.isInteger(escala) && escala >= 0) {
        return 10n ** BigInt(escala);
      }
      return null;

    // Céntimos (dinero: enteros con sufijo C)
    // ------------------------------------------------------------

    nucleo.centimos = function (texto) {
      var v = parseDecimalABigInt(String(texto), 2);
      if (v === null) return null;
      if (v > LIMITE_SEGURO || v < -LIMITE_SEGURO) return null;
      return Number(v);
    };

    nucleo.redondear = function (numero) {
      if (typeof numero !== 'number' || !Number.isFinite(numero)) return NaN;
      return numero >= 0 ? Math.floor(numero + 0.5) : Math.ceil(numero - 0.5);
    };

    // ------------------------------------------------------------
    // Hash / identificadores
    // ------------------------------------------------------------
    nucleo.sha1 = async function (texto) {
      var datos = new TextEncoder().encode(String(texto));
      var buffer = await crypto.subtle.digest('SHA-1', datos);
      var bytes = new Uint8Array(buffer);
      var hex = '';
      for (var i = 0; i < bytes.length; i++) {
        hex += bytes[i].toString(16).padStart(2, '0');
      }
      return hex;
    };

    nucleo.id = function (prefijo) {
      var p = (typeof prefijo === 'string' && prefijo.length) ? prefijo : 'id';
      var azar;
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        azar = crypto.randomUUID().replace(/-/g, '');
      } else {

      }
      return p + '_' + azar.slice(0, 16);

    // Unidades: decimales de activo con BigInt escalado
    // (1e8 cripto, 1e6 participaciones)

    // entero de decimales (recomendado) o factor BigInt ya escalado.
    // ------------------------------------------------------------

    nucleo.ESCALA_PARTICIPACIONES = 1000000n;  // 1e6 → equivalente a 6 decimales

    nucleo.unidadesABigInt = function (texto, escala) {
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      return parseDecimalABigInt(String(texto), numDecimales(factor));

    // Convención de estado: signo explícito ('+' / '-'), sin signo
    // solo para el cero, relleno con ceros hasta los decimales de
    // la escala.

      if (typeof valor !== 'bigint') return null;
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      var decimales = numDecimales(factor);
      var esCero = valor === 0n;
      var negativo = valor < 0n;
      var abs = negativo ? -valor : valor;
      var entero = abs / factor;
      var frac = (abs % factor).toString().padStart(decimales, '0');

      var resultado = signo + entero.toString();
      if (decimales > 0) resultado += '.' + frac;
      return resultado;
    };

    nucleo.sumarUnidades = function (a, b, escala) {
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      var va = nucleo.unidadesABigInt(a, factor);
      var vb = nucleo.unidadesABigInt(b, factor);
      if (va === null || vb === null) return null;
      return nucleo.unidadesATexto(va + vb, factor);
    };

    nucleo.restarUnidades = function (a, b, escala) {
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      var va = nucleo.unidadesABigInt(a, factor);
      var vb = nucleo.unidadesABigInt(b, factor);
      if (va === null || vb === null) return null;
      return nucleo.unidadesATexto(va - vb, factor);
    };

    nucleo.compararUnidades = function (a, b, escala) {
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      var va = nucleo.unidadesABigInt(a, factor);
      var vb = nucleo.unidadesABigInt(b, factor);
      if (va === null || vb === null) return null;
      if (va < vb) return -1;
      if (va > vb) return 1;
      return 0;
    };

    nucleo.unidadesSonCero = function (texto, escala) {
      var factor = resolverEscala(escala);
      if (factor === null) return null;
      var v = nucleo.unidadesABigInt(texto, factor);
      if (v === null) return null;
      return v === 0n;
    };

    var RE_SIGNO_CUERPO = /^([+-]?)(\d+(?:\.\d+)?)$/;

    // Misma convención de signo que unidadesATexto: '+' explícito

      var eraNegativo = m[1] === '-';
      return (eraNegativo ? '+' : '-') + cuerpo;
    };

    nucleo.absUnidades = function (texto) {
      if (typeof texto !== 'string') return null;
      var m = RE_SIGNO_CUERPO.exec(texto.trim());
      if (!m) return null;
      var cuerpo = m[2];
      var esCero = /^0+(\.0+)?$/.test(cuerpo);
      if (esCero) return cuerpo;
      return '+' + cuerpo;
    };

    // Ajusta un decimal con signo a los decimales indicados
    // (p. ej. los decimales de corte de un activo), redondeando
    // con el mismo criterio que el resto del módulo. Devuelve la
    // misma convención de signo/relleno que unidadesATexto.

      if (typeof decimales !== 'number' || !Number.isInteger(decimales) || decimales < 0) return null;
      var v = parseDecimalABigInt(String(texto), decimales);
      if (v === null) return null;
      return nucleo.unidadesATexto(v, decimales);
    };

    // ------------------------------------------------------------
    // Fechas y meses en Europe/Madrid
    // Fechas "YYYY-MM-DD", meses "YYYY-MM"
    // ------------------------------------------------------------
    var FORMATEADOR_MADRID = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Madrid',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    });

    function formatoMadridYMD(fecha) {
      return FORMATEADOR_MADRID.format(fecha);
    }

    nucleo.hoy = function () {
      return formatoMadridYMD(new Date());
    };

    nucleo.mesActual = function () {
      return nucleo.hoy().slice(0, 7);
    };

    nucleo.utcAFechaMadrid = function (isoUtc) {
      if (typeof isoUtc !== 'string') return null;
      var d = new Date(isoUtc);
      if (isNaN(d.getTime())) return null;
      return formatoMadridYMD(d);
    };

    nucleo.utcAMesMadrid = function (isoUtc) {
      var f = nucleo.utcAFechaMadrid(isoUtc);
      return f ? f.slice(0, 7) : null;
    };

    var RE_FECHA = /^(\d{4})-(\d{2})-(\d{2})$/;
    var RE_MES = /^\d{4}-(0[1-9]|1[0-2])$/;

    nucleo.esFechaValida = function (texto) {
      if (typeof texto !== 'string') return false;
      var m = RE_FECHA.exec(texto);
      if (!m) return false;
      var a = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
      if (mo < 1 || mo > 12) return false;
      var dt = new Date(Date.UTC(a, mo - 1, d));
      return dt.getUTCFullYear() === a && dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d;
    };

    nucleo.esMesValido = function (texto) {
      return typeof texto === 'string' && RE_MES.test(texto);
    };

    nucleo.fechaAMes = function (fecha) {
      return nucleo.esFechaValida(fecha) ? fecha.slice(0, 7) : null;
    };

    nucleo.sumarMeses = function (ym, n) {
      if (!nucleo.esMesValido(ym) || !Number.isInteger(n)) return null;
      var partes = ym.split('-');
      var anio = Number(partes[0]);
      var mes = Number(partes[1]);
      var total = anio * 12 + (mes - 1) + n;
      var nuevoAnio = Math.floor(total / 12);
      var nuevoMes = (total % 12) + 1;
      return String(nuevoAnio).padStart(4, '0') + '-' + String(nuevoMes).padStart(2, '0');
    };

    nucleo.compararFechas = function (a, b) {
      if (!nucleo.esFechaValida(a) || !nucleo.esFechaValida(b)) return null;
      if (a < b) return -1;
      if (a > b) return 1;
      return 0;
    };

    nucleo.compararMeses = function (a, b) {
      if (!nucleo.esMesValido(a) || !nucleo.esMesValido(b)) return null;
      if (a < b) return -1;
      if (a > b) return 1;
      return 0;
    };

    nucleo.diferenciaHoras = function (isoUtcA, isoUtcB) {
      var da = new Date(isoUtcA);
      var db = new Date(isoUtcB);
      if (isNaN(da.getTime()) || isNaN(db.getTime())) return null;
      return (db.getTime() - da.getTime()) / 3600000;
    };

    global.nucleo = Object.freeze(nucleo);

/*
 * store — puerta única del estado (contrato sección (c) sobre el esquema (a))
 *
 * Convenciones respetadas:
 *  - Dinero en enteros de céntimos (importeC): nunca aritmética en coma flotante sobre
 *    ellos; este módulo solo los lee y los compara como enteros, jamás los suma.
 *  - Unidades como string decimal con signo: toda aritmética de unidades usa BigInt
 *    escalado. Se usa una única escala de 1e8 (en vez de 1e8 para cripto / 1e6 para
 *    participaciones por separado) porque 1e8 = 1e6 × 100 es múltiplo exacto de ambas:
 *    ningún activo del esquema declara más de 8 decimales, así que la escala común no
 *    pierde precisión frente a usar la escala propia de cada clase de activo, y permite
 *    sumar unidades de activos distintos sin tener que resolver antes su `decimales`.
 *  - Nada derivado se guarda en el Estado; el único derivado persistido es `mes.cierre`,
 *    y ese campo no lo escribe `store` sino `meses` — `store` no lo toca ni lo inventa.
 *  - El estado siempre es JSON-serializable: `store` nunca cuelga BigInt, funciones ni
 *    referencias circulares del Estado.

  const PREFIJO_BACKUP = 'reparto_estado_backup_';
  const MAX_BACKUPS = 5;
  const SCHEMA_ACTUAL = 2;
  const MAX_UNDO = 20;
  const RETRASO_DEBOUNCE_MS = 400;

  // Escala común para BigInt de unidades — ver nota de cabecera.
  const ESCALA = 100000000n; // 1e8

  const TIPOS_MOVIMIENTO = new Set([
    'compra', 'venta', 'unidades', 'aportacion_categoria', 'aportacion',
    'traspaso_salida', 'traspaso_entrada', 'interes', 'dividendo',
    'rendimiento_unidades', 'apertura', 'ajuste'

  // Utilidades internas sin dependencia de otros módulos
  // ---------------------------------------------------------------------

    return new Date().toISOString();

    // JSON es un clon fiel y seguro (sin referencias compartidas).
    return JSON.parse(JSON.stringify(obj));

    return typeof n === 'number' && Number.isInteger(n) && Number.isSafeInteger(n);
  }

  function esStringUnidad(s) {
    return typeof s === 'string' && /^[+-]?\d+(\.\d+)?$/.test(s);
  }

  function esFechaValida(f) {
    if (typeof f !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(f)) return false;
    const d = new Date(f + 'T00:00:00Z');
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === f;
  }

    const m = /^([+-]?)(\d+)(?:\.(\d+))?$/.exec(str);
    if (!m) throw new Error('unidad inválida: ' + str);
    const signo = m[1] === '-' ? -1n : 1n;
    const entera = BigInt(m[2]);
    const decStr = (m[3] || '').padEnd(8, '0').slice(0, 8);
    const decimal = BigInt(decStr === '' ? '0' : decStr);
    return signo * (entera * ESCALA + decimal);

    const entera = abs / ESCALA;
    const frac = (abs % ESCALA).toString().padStart(8, '0');
    return signo + entera.toString() + '.' + frac;

      schema: SCHEMA_ACTUAL,
      meta: {
        creado: ahora,
        actualizado: ahora,
        dispositivo: '',
        moneda: 'EUR'
      },

  // ---------------------------------------------------------------------

  function migrar(bruto) {

    if (Array.isArray(bruto.movimientos)) resultado.movimientos = bruto.movimientos;
    if (Array.isArray(bruto.valoraciones)) resultado.valoraciones = bruto.valoraciones;
    if (bruto.cachePrecios && typeof bruto.cachePrecios === 'object') resultado.cachePrecios = bruto.cachePrecios;
    if (Array.isArray(bruto.importaciones)) resultado.importaciones = bruto.importaciones;

  // ---------------------------------------------------------------------

  function crearError(mensaje, extra) {

  function comprobarIdsUnicos(lista, coleccion, errores) {
    const vistos = new Set();
    for (const item of lista) {

        errores.push(crearError(coleccion + ': elemento sin id válido', { codigo: 'id_ausente', coleccion }));
        continue;

      if (vistos.has(item.id)) {
        errores.push(crearError(coleccion + ': id duplicado "' + item.id + '"', { codigo: 'id_duplicado', coleccion, id: item.id }));
      }

  function comprobarTraspasos(movimientos, errores) {
    const grupos = new Map();
    for (const m of movimientos) {
      if (!m || m.grupoTraspaso == null) continue;
      if (!grupos.has(m.grupoTraspaso)) grupos.set(m.grupoTraspaso, []);
      grupos.get(m.grupoTraspaso).push(m.id);

      if (ids.length !== 2) {
        errores.push(crearError(
          'grupoTraspaso "' + grupo + '" no forma una pareja completa (' + ids.length + ' movimiento(s))',
          { codigo: 'grupo_traspaso_incompleto', grupoTraspaso: grupo, movimientos: ids }

  // El invariante es sobre la POSICIÓN ACTUAL, no sobre cada instante de la historia.
  // Motivo (verificado contra el export real de Binance): el CSV de Spot no muestra la pata
  // de Simple Earn, así que el saldo intermedio baja a negativo a mitad de serie aunque el
  // final sea correcto. Comprobar cada día rechazaba el import entero con 756 errores
  // mientras los cinco saldos finales eran exactos. El bajón intermedio ya lo avisa el
  // importador; aquí solo se mira dónde se ha acabado.
  function comprobarSaldosNoNegativos(movimientos, errores) {
    const porPar = new Map();
    for (const m of movimientos) {
      if (!m || m.unidades == null || !m.activoId || !m.ubicacionId) continue;
      if (!esStringUnidad(m.unidades) || !esFechaValida(m.fecha)) continue; // ya reportado aparte
      const clave = m.activoId + '\u0000' + m.ubicacionId;
      porPar.set(clave, (porPar.get(clave) || 0n) + unidadAEscalado(m.unidades));
    }

    for (const [clave, saldo] of porPar) {
      if (saldo >= 0n) continue;
      const [activoId, ubicacionId] = clave.split('\u0000');
      errores.push(crearError(
        'posición actual negativa para activo "' + activoId + '" en ubicación "' + ubicacionId + '" (' + escaladoADecimal(saldo) + ')',
        { codigo: 'saldo_negativo', activoId, ubicacionId, saldo: escaladoADecimal(saldo) }
      ));
    }
  }


  function validar(e) {
    const errores = [];

    if (e === null || typeof e !== 'object') {
      errores.push(crearError('el estado no es un objeto', { codigo: 'estado_invalido' }));
      return { ok: false, errores };
    }

    if (typeof e.schema !== 'number') errores.push(crearError('schema ausente o no numérico', { codigo: 'schema' }));
    if (!e.meta || typeof e.meta !== 'object') errores.push(crearError('meta ausente', { codigo: 'meta' }));
    if (!e.config || typeof e.config !== 'object') errores.push(crearError('config ausente', { codigo: 'config' }));
    if (!Array.isArray(e.ubicaciones)) errores.push(crearError('ubicaciones debe ser un array', { codigo: 'ubicaciones' }));
    if (!Array.isArray(e.activos)) errores.push(crearError('activos debe ser un array', { codigo: 'activos' }));
    if (!e.meses || typeof e.meses !== 'object' || Array.isArray(e.meses)) errores.push(crearError('meses debe ser un objeto', { codigo: 'meses' }));
    if (!Array.isArray(e.movimientos)) errores.push(crearError('movimientos debe ser un array', { codigo: 'movimientos' }));
    if (!Array.isArray(e.valoraciones)) errores.push(crearError('valoraciones debe ser un array', { codigo: 'valoraciones' }));
    if (!e.cachePrecios || typeof e.cachePrecios !== 'object') errores.push(crearError('cachePrecios ausente', { codigo: 'cachePrecios' }));
    if (!Array.isArray(e.importaciones)) errores.push(crearError('importaciones debe ser un array', { codigo: 'importaciones' }));
    if (!e.ui || typeof e.ui !== 'object') errores.push(crearError('ui ausente', { codigo: 'ui' }));

    if (errores.length > 0) return { ok: false, errores }; // sin forma mínima no se puede seguir

    comprobarIdsUnicos(e.activos, 'activos', errores);
    comprobarIdsUnicos(e.ubicaciones, 'ubicaciones', errores);
    comprobarIdsUnicos(e.movimientos, 'movimientos', errores);
    comprobarIdsUnicos(e.valoraciones, 'valoraciones', errores);

    for (const m of e.movimientos) {
      if (!m || typeof m !== 'object') {
        errores.push(crearError('movimiento no es un objeto', { codigo: 'movimiento_forma' }));
        continue;
      }
      if (!esFechaValida(m.fecha)) {
        errores.push(crearError('movimiento ' + m.id + ': fecha inválida "' + m.fecha + '"', { codigo: 'movimiento_fecha', movId: m.id }));
      }
      if (typeof m.tipo !== 'string' || !TIPOS_MOVIMIENTO.has(m.tipo)) {
        errores.push(crearError('movimiento ' + m.id + ': tipo desconocido "' + m.tipo + '"', { codigo: 'movimiento_tipo', movId: m.id }));
      }
      if (m.unidades != null && !esStringUnidad(m.unidades)) {
        errores.push(crearError('movimiento ' + m.id + ': unidades no es un string decimal con signo válido', { codigo: 'movimiento_unidades', movId: m.id }));
      }
      if (m.importeC != null && !esEnteroSeguro(m.importeC)) {
        errores.push(crearError('movimiento ' + m.id + ': importeC no es un entero seguro', { codigo: 'movimiento_importe', movId: m.id }));
      }
    }

    comprobarTraspasos(e.movimientos, errores);

    for (const ym of Object.keys(e.meses)) {
      const mes = e.meses[ym];
      if (!mes || mes.ym !== ym) {
        errores.push(crearError('meses["' + ym + '"]: mes.ym no coincide con la clave', { codigo: 'mes_ym', ym }));
      }
    }

    // Consecuencia derivada 6: para cada par (activo, ubicación), el saldo
    // acumulado en cualquier instante debe ser >= 0.
    comprobarSaldosNoNegativos(e.movimientos, errores);

  // ---------------------------------------------------------------------
  // Estado en memoria, suscriptores y pilas de deshacer/rehacer
  // ---------------------------------------------------------------------

  let estadoActual = crearVacio();
  const suscriptores = new Set();
  const pilaDeshacer = [];
  const pilaRehacer = [];
  let temporizadorPersistencia = null;
  let pendienteDePersistir = null;

  function leer() {
    return Object.freeze(clonar(estadoActual));
  }

  function suscribir(fn) {
    suscriptores.add(fn);
    return function baja() {
      suscriptores.delete(fn);
    };
  }

  function notificar(estado, nombre) {
    for (const fn of suscriptores) {

      } catch (err) {

      }

  // ---------------------------------------------------------------------
  // store.persistir — debounce + backup rotativo
  // ---------------------------------------------------------------------

  function rotarBackups(textoAnterior) {
    if (!tieneLocalStorage()) return;
    try {
      localStorage.setItem(PREFIJO_BACKUP + Date.now(), textoAnterior);
      const claves = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(PREFIJO_BACKUP) === 0) claves.push(k);
      }
      claves.sort();
      while (claves.length > MAX_BACKUPS) {
        localStorage.removeItem(claves.shift());
      }
    } catch (err) {
      // el backup es best-effort; no debe romper la persistencia principal
    }

  function escribirConBackup(e) {
    if (!tieneLocalStorage()) return;
    try {
      const anterior = localStorage.getItem(CLAVE_ESTADO);
      if (anterior) rotarBackups(anterior);
      localStorage.setItem(CLAVE_ESTADO, JSON.stringify(e));

  function persistir(e) {

    if (temporizadorPersistencia) clearTimeout(temporizadorPersistencia);
    temporizadorPersistencia = setTimeout(function () {
      temporizadorPersistencia = null;
      const aEscribir = pendienteDePersistir;
      pendienteDePersistir = null;
      escribirConBackup(aEscribir);
    }, RETRASO_DEBOUNCE_MS);

  // ---------------------------------------------------------------------
  // store.cargar
  // ---------------------------------------------------------------------

  function recuperarDeBackup() {
    if (!tieneLocalStorage()) return null;
    try {
      const claves = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(PREFIJO_BACKUP) === 0) claves.push(k);
      }
      claves.sort().reverse();
      for (const k of claves) {
        try {
          const texto = localStorage.getItem(k);
          if (texto) return JSON.parse(texto);
        } catch (err) {
          continue;
        }
      }
    } catch (err) {
      // localStorage no disponible o corrupto
    }
    return null;
  }

  function cargar() {
    let bruto = null;
    if (tieneLocalStorage()) {
      try {
        const texto = localStorage.getItem(CLAVE_ESTADO);
        if (texto) bruto = JSON.parse(texto);
      } catch (err) {
        bruto = recuperarDeBackup();
      }
    }

    const migrado = migrar(bruto);
    const { ok, errores } = validar(migrado);
    if (!ok && typeof console !== 'undefined') {
      console.warn('store.cargar: el estado cargado no cumple los invariantes', errores.map(function (er) { return er.message; }));
    }

    estadoActual = migrado;
    pilaDeshacer.length = 0;
    pilaRehacer.length = 0;
    return leer();
  }

  // ---------------------------------------------------------------------
  // store.commit
  // ---------------------------------------------------------------------

  function commit(nombre, fn) {
    const anterior = estadoActual;
    const propuesto = fn(clonar(anterior));

    const { ok, errores } = validar(propuesto);
    if (!ok) {
      const error = crearError('commit "' + nombre + '" rechazado: ' + errores.map(function (er) { return er.message; }).join('; '));
      error.errores = errores;
      throw error;
    }

    propuesto.meta = Object.assign({}, propuesto.meta, { actualizado: ahoraISO() });

    pilaDeshacer.push(anterior);
    if (pilaDeshacer.length > MAX_UNDO) pilaDeshacer.shift();
    pilaRehacer.length = 0;

    estadoActual = propuesto;
    persistir(estadoActual);
    notificar(leer(), nombre);
    return estadoActual;
  }

  // ---------------------------------------------------------------------
  // store.deshacer / store.rehacer
  // ---------------------------------------------------------------------

  function deshacer() {
    if (pilaDeshacer.length === 0) return estadoActual;
    const previo = pilaDeshacer.pop();
    pilaRehacer.push(estadoActual);
    estadoActual = previo;
    persistir(estadoActual);
    notificar(leer(), 'deshacer');
    return estadoActual;
  }

  function rehacer() {
    if (pilaRehacer.length === 0) return estadoActual;
    const siguiente = pilaRehacer.pop();
    pilaDeshacer.push(estadoActual);
    if (pilaDeshacer.length > MAX_UNDO) pilaDeshacer.shift();
    estadoActual = siguiente;
    persistir(estadoActual);
    notificar(leer(), 'rehacer');
    return estadoActual;
  }

  // ---------------------------------------------------------------------
  // store.exportar
  // ---------------------------------------------------------------------

  function exportar(e) {
    const sobre = {
      formato: 'reparto-mensual-export',
      version: SCHEMA_ACTUAL,
      exportadoEn: ahoraISO(),
      estado: clonar(e)
    };
    return new Blob([JSON.stringify(sobre, null, 2)], { type: 'application/json' });
  }

  // ---------------------------------------------------------------------
  // store.importar
  // ---------------------------------------------------------------------

  function fusionarPorId(resultado, coleccion, entrantes, informe) {
    const existentes = new Set(resultado[coleccion].map(function (x) { return x.id; }));
    for (const item of entrantes) {
      if (existentes.has(item.id)) {
        informe.duplicados++;
        informe.descartados++;
        continue;
      }
      resultado[coleccion].push(item);
      existentes.add(item.id);
      informe.aceptados++;
    }
  }

  function fusionarEstados(actual, entrante, informe) {
    const resultado = clonar(actual);

    const hashesExistentes = new Set(
      actual.movimientos.filter(function (m) { return m && m.hash != null; }).map(function (m) { return m.hash; })
    );
    const idsExistentes = new Set(actual.movimientos.map(function (m) { return m.id; }));

    for (const m of entrante.movimientos) {
      const chocaPorId = idsExistentes.has(m.id);
      const chocaPorHash = m.hash != null && hashesExistentes.has(m.hash);
      if (chocaPorId || chocaPorHash) {
        informe.duplicados++;
        informe.descartados++;
        continue;
      }
      resultado.movimientos.push(m);
      idsExistentes.add(m.id);
      if (m.hash != null) hashesExistentes.add(m.hash);
      informe.aceptados++;
    }

    fusionarPorId(resultado, 'activos', entrante.activos, informe);
    fusionarPorId(resultado, 'ubicaciones', entrante.ubicaciones, informe);
    fusionarPorId(resultado, 'valoraciones', entrante.valoraciones, informe);
    fusionarPorId(resultado, 'importaciones', entrante.importaciones, informe);

    for (const ym of Object.keys(entrante.meses)) {
      if (!(ym in resultado.meses)) {
        resultado.meses[ym] = entrante.meses[ym];
        informe.aceptados++;
      } else {
        informe.duplicados++;
        informe.descartados++;
      }
    }

    return resultado;
  }

  function importar(texto, modo) {
    const informe = { ok: false, aceptados: 0, descartados: 0, duplicados: 0, errores: [] };

    let sobre;
    try {
      sobre = JSON.parse(texto);
    } catch (err) {
      informe.errores.push('JSON ilegible: ' + err.message);
      return { estado: leer(), informe };
    }

    const bruto = (sobre && typeof sobre === 'object' && sobre.estado) ? sobre.estado : sobre;
    const entrante = migrar(bruto);
    const validacionEntrante = validar(entrante);
    if (!validacionEntrante.ok) {
      informe.errores = validacionEntrante.errores.map(function (er) { return er.message; });
      return { estado: leer(), informe };
    }

    let resultado;
    if (modo === 'reemplazar') {
      resultado = entrante;
      informe.aceptados = entrante.movimientos.length + entrante.activos.length +
        entrante.ubicaciones.length + entrante.valoraciones.length +
        entrante.importaciones.length + Object.keys(entrante.meses).length;
    } else if (modo === 'fusionar') {
      resultado = fusionarEstados(estadoActual, entrante, informe);
    } else {
      informe.errores.push('modo de importación desconocido: ' + modo);
      return { estado: leer(), informe };
    }

    const validacionResultado = validar(resultado);
    if (!validacionResultado.ok) {
      informe.ok = false;
      informe.errores = informe.errores.concat(validacionResultado.errores.map(function (er) { return er.message; }));
      return { estado: leer(), informe };
    }

    informe.ok = true;
    return { estado: resultado, informe };
  }

  // ---------------------------------------------------------------------

  return Object.freeze({
    crearVacio,
    cargar,
    commit,
    leer,
    suscribir,
    persistir,
    migrar,
    validar,
    deshacer,
    rehacer,
    exportar,
    importar
  });
})();

// En el navegador `const store` ya sería visible entre <script>, pero los arneses cargan cada
// módulo en un contexto aislado y leen `global.<modulo>`: sin esta línea, `store` es el único
// de los seis que no se puede cargar igual que los demás.
if (typeof window !== 'undefined') { window.store = store; }
