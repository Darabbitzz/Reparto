name: pages

# Publica la app en GitHub Pages por Actions. Sustituye a la construcción «legacy»
# por rama, que el 06/08/2026 se quedó atascada en su cola y dejó tres versiones
# sin publicar sin dar ningún error útil: el build salía bien y el despliegue
# expiraba en silencio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Los despliegues de Pages se hacen en cola y NO se cancelan a medias: si se
# corta uno entre subir el artefacto y desplegarlo, el backend de Pages se
# queda con un despliegue que nunca termina y todos los siguientes se quedan
# esperando en «in_progress» hasta agotar el tiempo, con el build en verde.
# Es la propia recomendación de GitHub para este workflow, y aquí costó una
# tarde entera el 06/08/2026: cada cuelgue vino detrás de uno cancelado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
